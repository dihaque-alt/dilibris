<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DiLibris — кіт, згорнутий навколо свічки">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#FBF7EE"></stop>
      <stop offset="42%" stop-color="#F1EAD9"></stop>
      <stop offset="78%" stop-color="#E4D9C2"></stop>
      <stop offset="100%" stop-color="#CBBE9F"></stop>
