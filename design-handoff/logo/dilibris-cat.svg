      <path d="M150 408 C 176 398, 214 398, 240 408" stroke="#33472A" stroke-width="3" fill="none" opacity="0.4"></path>
    </g>

    
    <rect width="512" height="512" fill="#000" opacity="0.05" filter="url(#grain)"></rect>
    
    <circle cx="256" cy="256" r="252" fill="none" stroke="#3E5435" stroke-width="6" opacity="0.22"></circle>
  </g>
</svg>