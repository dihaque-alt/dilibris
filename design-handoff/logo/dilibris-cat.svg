      <path d="M214 346 C 222 352, 232 352, 240 346" stroke="#2E3F28" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.8"></path>
      
      <path d="M188 378 L 206 378 L 197 390 Z" fill="#3E5435"></path>
      
