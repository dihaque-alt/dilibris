      <stop offset="35%" stop-color="#F6D77A" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#F6D77A" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="candle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5F7E54"></stop>
      <stop offset="34%" stop-color="#9FB191"></stop>
      <stop offset="50%" stop-color="#C4D0B6"></stop>
      <stop offset="68%" stop-color="#88A079"></stop>
      <stop offset="100%" stop-color="#4C6643"></stop>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF4CE"></stop>
      <stop offset="38%" stop-color="#FBD96B"></stop>
      <stop offset="100%" stop-color="#EBA12E"></stop>
    </linearGradient>
    <radialGradient id="body" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#AEBF9F"></stop>
      <stop offset="40%" stop-color="#86A276"></stop>
      <stop offset="72%" stop-color="#647F56"></stop>
      <stop offset="100%" stop-color="#3E5435"></stop>
    </radialGradient>
    <radialGradient id="tail" cx="46%" cy="32%" r="78%">
