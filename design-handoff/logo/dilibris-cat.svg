      <path d="M214 298 L 236 256 L 256 304 Z" fill="#5C7850"></path>
      <path d="M218 300 L 236 262 L 250 300 Z" fill="#445E3A"></path>
      
      <path d="M163 300 L 170 282 L 182 300 Z" fill="#9FB191" opacity="0.7"></path>
      <path d="M227 296 L 236 276 L 247 298 Z" fill="#9FB191" opacity="0.7"></path>
      
      <ellipse cx="200" cy="350" rx="68" ry="58" fill="url(#head)"></ellipse>
      
      <ellipse cx="208" cy="386" rx="56" ry="34" fill="#33472A" opacity="0.4" filter="url(#soft)"></ellipse>
      <ellipse cx="186" cy="330" rx="34" ry="26" fill="#C2D0B4" opacity="0.55" filter="url(#soft)"></ellipse>
      
      <ellipse cx="196" cy="378" rx="40" ry="28" fill="#9DB28C" opacity="0.85" filter="url(#soft)"></ellipse>
      
