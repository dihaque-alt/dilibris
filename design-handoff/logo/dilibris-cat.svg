      <stop offset="55%" stop-color="#5F7E54"></stop>
      <stop offset="100%" stop-color="#324528"></stop>
    </radialGradient>
    <radialGradient id="head" cx="50%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#B3C3A4"></stop>
      <stop offset="50%" stop-color="#85A074"></stop>
      <stop offset="100%" stop-color="#4B6541"></stop>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"></feGaussianBlur>
    </filter>
    <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"></feGaussianBlur>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"></feTurbulence>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.18  0 0 0 0 0.22  0 0 0 0 0.14  0 0 0 0.5 0"></feColorMatrix>
    </filter>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"></circle></clipPath>
  </defs>

