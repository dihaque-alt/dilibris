    <path d="M168 300 C 230 262, 320 264, 372 308 C 320 286, 232 286, 188 318 C 178 312, 172 306, 168 300 Z" fill="#C2D0B4" opacity="0.6" filter="url(#soft)"></path>

    
    <g stroke="#33472A" stroke-width="9" stroke-linecap="round" fill="none" opacity="0.4" filter="url(#soft)">
      <path d="M214 268 C 210 286, 208 300, 210 316"></path>
      <path d="M256 262 C 254 282, 254 298, 256 318"></path>
      <path d="M298 266 C 300 286, 300 300, 298 320"></path>
      <path d="M338 282 C 344 298, 346 310, 344 326"></path>
    </g>
    
